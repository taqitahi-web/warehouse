<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — EPFBD WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:#0a0a0a;color:#f2f2f2;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;
  background-image:radial-gradient(ellipse at 20% 50%,rgba(62,207,142,.06) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 20%,rgba(129,140,248,.05) 0%,transparent 60%)}
.wrap{width:100%;max-width:420px}
/* Brand */
.brand{text-align:center;margin-bottom:32px}
.brand-mark{width:64px;height:64px;background:linear-gradient(135deg,#3ecf8e,#2ba671);
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 14px;box-shadow:0 8px 32px rgba(62,207,142,.35)}
.brand-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:#f2f2f2;letter-spacing:-.5px}
.brand-sub{font-size:13px;color:#606878;margin-top:4px}
/* Card */
.card{background:#141414;border:1px solid #252525;border-radius:20px;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.card-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;color:#f2f2f2;margin-bottom:4px}
.card-sub{font-size:13px;color:#606878;margin-bottom:24px}
/* User selector */
.user-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.user-btn{background:#1a1a1a;border:1px solid #252525;border-radius:12px;padding:12px;
  cursor:pointer;transition:all .18s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.user-btn:hover{background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.25)}
.user-btn.selected{background:rgba(62,207,142,.12);border-color:#3ecf8e;box-shadow:0 0 0 2px rgba(62,207,142,.2)}
.u-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;color:#0a0a0a}
.u-name{font-size:12.5px;font-weight:600;color:#f2f2f2}
.u-role{font-size:11px;color:#606878}
.u-factory{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:2px}
/* PIN pad */
.pin-section{display:none}
.pin-section.show{display:block}
.pin-label{font-size:12.5px;font-weight:600;color:#b8c0cc;margin-bottom:10px;text-align:center}
.pin-selected{font-size:13px;color:#3ecf8e;font-weight:700;text-align:center;margin-bottom:12px;
  background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.2);border-radius:10px;padding:8px}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid #2e2e2e;background:transparent;transition:all .18s}
.pin-dot.F{background:#3ecf8e;border-color:#3ecf8e;box-shadow:0 0 8px rgba(62,207,142,.4)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pkey{background:#1a1a1a;border:1px solid #252525;border-radius:12px;padding:14px;text-align:center;
  cursor:pointer;font-size:18px;font-weight:700;color:#f2f2f2;transition:all .18s;
  user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Plus Jakarta Sans',sans-serif}
.pkey:hover,.pkey:active{background:rgba(62,207,142,.12);border-color:rgba(62,207,142,.3);color:#3ecf8e;transform:scale(1.04)}
.pin-err{color:#f87171;font-size:12.5px;text-align:center;min-height:18px;margin-bottom:8px;font-weight:500}
.btn-login{width:100%;background:linear-gradient(135deg,#3ecf8e,#2ba671);color:#0a0a0a;
  border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:700;
  font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all .18s;
  box-shadow:0 4px 20px rgba(62,207,142,.3)}
.btn-login:hover{opacity:.88;transform:translateY(-1px)}
.btn-login:disabled{opacity:.4;cursor:default;transform:none}
.btn-back{background:transparent;border:1px solid #252525;color:#606878;
  padding:10px;border-radius:10px;font-size:13px;cursor:pointer;width:100%;margin-bottom:10px;
  font-family:'Inter',sans-serif;transition:all .18s}
.btn-back:hover{background:#1a1a1a;color:#f2f2f2}
/* Footer */
.footer{text-align:center;margin-top:20px;font-size:12px;color:#3a4252}
/* Role colors */
.av-admin{background:linear-gradient(135deg,#3ecf8e,#2ba671)}
.av-manager{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.av-viewer{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.role-admin{background:rgba(62,207,142,.15);color:#3ecf8e}
.role-manager{background:rgba(96,165,250,.15);color:#60a5fa}
.role-viewer{background:rgba(251,191,36,.15);color:#fbbf24}
/* Shake animation */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.shake{animation:shake .35s ease}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">🏭</div>
    <div class="brand-name">EPFBD WMS</div>
    <div class="brand-sub">Warehouse Management System v8</div>
  </div>

  <div class="card" id="stepUser">
    <div class="card-title">👋 স্বাগতম</div>
    <div class="card-sub">আপনার profile নির্বাচন করুন</div>
    <div class="user-list" id="userList"></div>
    <div style="text-align:center;font-size:12px;color:#3a4252;margin-top:4px">প্রোফাইল নির্বাচন করুন তারপর PIN দিন</div>
  </div>

  <div class="card" id="stepPin" style="display:none">
    <div class="pin-selected" id="selectedLabel">—</div>
    <div class="pin-label">4-digit PIN লিখুন</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-grid">
      <div class="pkey" onclick="pp('1')">1</div><div class="pkey" onclick="pp('2')">2</div><div class="pkey" onclick="pp('3')">3</div>
      <div class="pkey" onclick="pp('4')">4</div><div class="pkey" onclick="pp('5')">5</div><div class="pkey" onclick="pp('6')">6</div>
      <div class="pkey" onclick="pp('7')">7</div><div class="pkey" onclick="pp('8')">8</div><div class="pkey" onclick="pp('9')">9</div>
      <div class="pkey" onclick="pp('del')" style="font-size:16px;color:#606878">⌫</div>
      <div class="pkey" onclick="pp('0')">0</div>
      <div class="pkey" onclick="pp('ok')" style="color:#3ecf8e;font-size:16px">✓</div>
    </div>
    <div class="pin-err" id="pinErr"></div>
    <button class="btn-login" id="btnLogin" onclick="doLogin()" disabled>Login করুন</button>
    <div style="height:10px"></div>
    <button class="btn-back" onclick="goBack()">← ফিরে যান</button>
  </div>

  <div class="footer">EPFBD WMS · Secure Access · v8.1</div>
</div>

<script src="auth.js"></script>
<script>
var pinBuf='';
var selUser=null;
var ROLE_COLORS={admin:'av-admin',manager:'av-manager',viewer:'av-viewer'};
var ROLE_LABELS={admin:'Admin · All Access',manager:'Manager',viewer:'Viewer · Read Only'};
var FACTORY_CLR={admin:'role-admin',manager:'role-manager',viewer:'role-viewer'};

function renderUsers(){
  var users=WmsAuth.getUsers();
  var ul=document.getElementById('userList');
  ul.innerHTML=users.map(function(u){
    var avCls=ROLE_COLORS[u.role]||'av-viewer';
    var roleCls=FACTORY_CLR[u.role]||'role-viewer';
    var facLabel=u.factory==='ALL'?'All Factories':u.factory;
    return '<div class="user-btn" id="ub-'+u.id+'" onclick="selectUser(\''+u.id+'\')">'+
      '<div class="u-av '+avCls+'">'+u.avatar+'</div>'+
      '<div class="u-name">'+u.name+'</div>'+
      '<div class="u-role">'+ROLE_LABELS[u.role]+'</div>'+
      '<div class="u-factory '+roleCls+'">'+facLabel+'</div>'+
    '</div>';
  }).join('');
}

function selectUser(id){
  var users=WmsAuth.getUsers();
  selUser=null;
  for(var i=0;i<users.length;i++){if(users[i].id===id){selUser=users[i];break;}}
  if(!selUser)return;
  document.querySelectorAll('.user-btn').forEach(function(b){b.classList.remove('selected');});
  var el=document.getElementById('ub-'+id);
  if(el)el.classList.add('selected');
  // Show PIN step
  setTimeout(function(){
    document.getElementById('stepUser').style.display='none';
    document.getElementById('stepPin').style.display='block';
    var facLabel=selUser.factory==='ALL'?'All Factories':selUser.factory;
    document.getElementById('selectedLabel').textContent=
      selUser.avatar+' '+selUser.name+' · '+selUser.role.toUpperCase()+' · '+facLabel;
    pinBuf='';updateDots();
  },150);
}

function goBack(){
  document.getElementById('stepPin').style.display='none';
  document.getElementById('stepUser').style.display='block';
  selUser=null;pinBuf='';updateDots();
  document.getElementById('pinErr').textContent='';
}

function pp(v){
  if(v==='del'){pinBuf=pinBuf.slice(0,-1);}
  else if(v==='ok'){doLogin();}
  else if(pinBuf.length<4){pinBuf+=v;}
  updateDots();
  document.getElementById('btnLogin').disabled=pinBuf.length!==4;
  document.getElementById('pinErr').textContent='';
  if(pinBuf.length===4)setTimeout(doLogin,120);
}

function updateDots(){
  for(var i=0;i<4;i++){
    var d=document.getElementById('pd'+i);
    if(d)d.classList.toggle('F',i<pinBuf.length);
  }
}

function doLogin(){
  if(!selUser||pinBuf.length!==4)return;
  // Verify pin matches selected user
  if(selUser.pin!==pinBuf){
    document.getElementById('pinErr').textContent='❌ Wrong PIN. আবার চেষ্টা করুন।';
    var pg=document.getElementById('stepPin');
    pg.classList.add('shake');
    setTimeout(function(){pg.classList.remove('shake');},400);
    pinBuf='';updateDots();
    document.getElementById('btnLogin').disabled=true;
    return;
  }
  if(WmsAuth.login(pinBuf)){
    // Redirect to dashboard
    window.location.href='index.html';
  }else{
    document.getElementById('pinErr').textContent='❌ Login ব্যর্থ। আবার চেষ্টা করুন।';
    pinBuf='';updateDots();
  }
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('stepPin').style.display==='none')return;
  if(e.key>='0'&&e.key<='9')pp(e.key);
  else if(e.key==='Backspace')pp('del');
  else if(e.key==='Enter')pp('ok');
});

renderUsers();

// If already logged in, go to dashboard
if(WmsAuth.restore()){window.location.href='index.html';}
</script>
</body>
</html>
